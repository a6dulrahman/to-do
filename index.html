<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <script type="module" src="./src/main.js" defer></script>
    <title>TO-DO</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="#" style="text-decoration-line: none; color: black">To-Do</a>
      </nav>
    </header>
    <aside>
      <div class="project">
        <div class="container">
          <p>New Project</p>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <title>new project</title>
            <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
          </svg>
        </div>
      </div>
      <template id="project-tpl">
        <div class="project added">
          <div class="container">
            <p>Main</p>
            <div>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <title>add todo</title>
                <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
              </svg>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <title>expand todos</title>
                <path
                  d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"
                />
              </svg>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <title>delete project</title>
                <path
                  d="M9,3V4H4V6H5V19A2,2 0 0,0 7,21H17A2,2 0 0,0 19,19V6H20V4H15V3H9M7,6H17V19H7V6M9,8V17H11V8H9M13,8V17H15V8H13Z"
                />
              </svg>
            </div>
          </div>
          <ul hidden></ul>
        </div>
      </template>
      <template id="to-do-tpl">
        <div id="display-to-do">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <title>square-edit-outline</title>
            <path
              d="M5,3C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V12H19V19H5V5H12V3H5M17.78,4C17.61,4 17.43,4.07 17.3,4.2L16.08,5.41L18.58,7.91L19.8,6.7C20.06,6.44 20.06,6 19.8,5.75L18.25,4.2C18.12,4.07 17.95,4 17.78,4M15.37,6.12L8,13.5V16H10.5L17.87,8.62L15.37,6.12Z"
            />
          </svg>
          <div>
            <p class="to-do title"></p>
            <p class="to-do description"></p>
            <p class="to-do date"></p>
            <p class="to-do priority"></p>
          </div>
        </div>
      </template>
      <template id="edit-to-do">
        <form action="" id="edit-to-do">
          <label for="title"
            >title:
            <input
              type="text"
              name="title"
              id="title"
              maxlength="40"
              required="" /></label
          ><label for="description"
            >description:<input
              type="text"
              name="description"
              id="description"
              maxlength="200" /></label
          ><label for="due-date"
            >due-date:<input
              type="date"
              name="due-date"
              id="due-date"
              required="" /></label
          ><label for="priority"
            >priority:
            <select id="priority" name="priority">
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
            </select></label
          >
          <div>
            <button type="button" id="cancel-to-do">Cancel</button
            ><button type="submit">Add</button>
          </div>
        </form>
      </template>
    </aside>
    <main>
      <dialog class="project">
        <form action="">
          <label for="name"
            >name <input type="text" autofocus id="name" required
          /></label>
          <div>
            <button type="button" id="cancel-project">Cancel</button>
            <button type="submit">Add</button>
          </div>
        </form>
      </dialog>
      <dialog class="to-do">
        <form action="">
          <label for="title"
            >title:
            <input
              type="text"
              name="title"
              id="title"
              maxlength="40"
              required /></label
          ><label for="description"
            >description:<input
              type="text"
              name="description"
              id="description"
              maxlength="200" /></label
          ><label for="due-date"
            >due-date:<input
              type="date"
              name="due-date"
              id="due-date"
              required /></label
          ><label for="priority"
            >priority:
            <select id="priority" name="priority">
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
            </select></label
          >
          <div>
            <button type="button" id="cancel-to-do">Cancel</button
            ><button type="submit">Add</button>
          </div>
        </form>
      </dialog>
    </main>
    <footer>
      <a href="https://github.com/a6dulrahman">
        <img
          src="https://avatars.githubusercontent.com/u/307510253?v=4"
          alt=""
          loading="lazy"
        />
        <p>a6dulrahman</p>
      </a>
    </footer>
  </body>
</html>
